<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- left prong (shorter) -->
  <line x1="6.5" y1="2.5" x2="6.5" y2="8.5" stroke="#ffffff" stroke-width="1.4"/>
  <!-- center prong (longest) -->
  <line x1="12" y1="1" x2="12" y2="9" stroke="#ffffff" stroke-width="1.4"/>
  <!-- right prong (shorter) -->
  <line x1="17.5" y1="2.5" x2="17.5" y2="8.5" stroke="#ffffff" stroke-width="1.4"/>
  <!-- crossbar -->
  <line x1="5" y1="8.5" x2="19" y2="8.5" stroke="#ffffff" stroke-width="1.4"/>
  <!-- shaft (single, long) -->
  <line x1="12" y1="9" x2="12" y2="23" stroke="#ffffff" stroke-width="1.4"/>
  <!-- crossbar junction fill -->
  <rect x="11" y="7.5" width="2" height="3" fill="#ffffff"/>
</svg>
