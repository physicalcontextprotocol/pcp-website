[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcp-conformance"
version = "0.5.0"
description = "P-MCP conformance tests — JSON-RPC wire and protocol conformance for any P-MCP server implementation"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "P-MCP Contributors"}]
requires-python = ">=3.9"

# These tests only need pytest + aiohttp + pytest-asyncio. They do NOT
# depend on any P-MCP SDK — the mock robot server is self-contained in
# conftest.py. The suite verifies wire behavior, so any implementation
# under test should be launched separately and its base URL wired into
# `mock_robot_server` (see conftest.py for the current in-process mock).
dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Sandeeprdy1729/P-MCP"
Specification = "https://github.com/Sandeeprdy1729/P-MCP/tree/main/pmcp-spec"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
